<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" aria-hidden="true"><use href="#i-plan" /></svg>
      <span class="brand-text">Floor Plan Editor</span>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-quiet" id="new-btn" title="Start a new drawing">
        <svg aria-hidden="true"><use href="#i-new" /></svg>New
      </button>
      <button class="btn btn-quiet" id="open-file-btn" title="Open a drawing from your disk (⌘O)">
        <svg aria-hidden="true"><use href="#i-upload" /></svg>Open
      </button>
      <button class="btn btn-quiet" id="save-file-btn" title="Save to your disk (⌘S)">
        <svg aria-hidden="true"><use href="#i-download" /></svg>Save
      </button>
      <button class="btn btn-quiet" id="import-btn" title="Bring in a PDF or a photo to trace">
        <svg aria-hidden="true"><use href="#i-upload" /></svg>Trace
      </button>
      <button class="btn" id="export-btn" title="Export a drawing, an image or a schedule">
        <svg aria-hidden="true"><use href="#i-download" /></svg>Export
      </button>
    </div>
    <div class="topbar-spacer"></div>
    <div class="doc-name" id="doc-name" title="Not saved to a file">Not saved to a file</div>
    <div class="topbar-spacer"></div>
    <div class="topbar-actions">
      <button class="btn btn-quiet btn-icon" id="undo" title="Undo (⌘Z)" aria-label="Undo">
        <svg aria-hidden="true"><use href="#i-undo" /></svg>
      </button>
      <button class="btn btn-quiet btn-icon" id="redo" title="Redo (⇧⌘Z)" aria-label="Redo">
        <svg aria-hidden="true"><use href="#i-redo" /></svg>
      </button>
      <button class="btn btn-quiet btn-icon" id="view-btn" title="What to show (Y)" aria-label="What to show" aria-expanded="false">
        <svg aria-hidden="true"><use href="#i-eye" /></svg>
      </button>
      <button class="btn btn-quiet btn-icon" id="settings-btn" title="Drawing settings (,)" aria-label="Drawing settings">
        <svg aria-hidden="true"><use href="#i-settings" /></svg>
      </button>
      <button class="btn btn-quiet btn-icon" id="help-btn" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">
        <svg aria-hidden="true"><use href="#i-help" /></svg>
      </button>
      <button class="btn btn-quiet btn-icon panel-toggle" id="panel-toggle" aria-label="Show panel">
        <svg aria-hidden="true"><use href="#i-panel" /></svg>
      </button>
    </div>
  </header>

  <div class="optbar" id="optbar" aria-label="Tool options"></div>

  <div class="workbench">
    <nav class="rail" id="rail" aria-label="Tools"></nav>
    <div class="stage" id="stage">
      <button class="ruler-corner" id="ruler-corner" type="button" title="Clear the guides"
        aria-label="Clear the guides"><svg aria-hidden="true"><use href="#i-guide" /></svg></button>
      <canvas class="ruler ruler-h" id="ruler-h"></canvas>
      <canvas class="ruler ruler-v" id="ruler-v"></canvas>
      <div class="canvas-wrap" id="canvas-wrap">
        <canvas id="board"></canvas>
        <canvas id="board3d" hidden></canvas>
        <canvas id="board3d-marks" hidden></canvas>
        <div class="view-switch" id="view-switch">
          <button class="switch-btn" type="button" data-mode="2d" aria-pressed="true">Plan</button>
          <button class="switch-btn" type="button" data-mode="3d" aria-pressed="false">3D</button>
        </div>
        <div class="view3d-help" id="view3d-help" hidden></div>
        <div class="radar" id="radar" hidden>
          <canvas id="radar-canvas"></canvas>
          <div class="radar-label" id="radar-label"></div>
        </div>
        <div class="view3d-note" id="view3d-note" hidden></div>
        <div class="numeric" id="numeric" hidden></div>
        <div class="hint" id="hint" hidden></div>
        <div class="flash" id="flash" role="status" aria-live="polite"></div>
      </div>
    </div>
    <aside class="inspector" id="inspector" aria-label="Properties"></aside>
    <aside class="drawer" id="settings-drawer" aria-label="Drawing settings" hidden></aside>
  </div>

  <footer class="statusbar" id="statusbar"></footer>
</div>

<input type="file" id="file-input" accept="application/pdf,image/png,image/jpeg,application/json,.json" hidden />
